version: "3.9"
services:
  backend:
    build: ./backend
    container_name: app-scan-barcode-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/db.sqlite:/app/db.sqlite

  frontend:
    build: ./frontend
    container_name: app-scan-barcode-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
